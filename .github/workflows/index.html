<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prasheen Dehda | Cloud & AI Leader</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Product+Sans:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f6eceb; color: #2f3e3e; margin: 0; }
        .font-cursive { font-family: 'Caveat', cursive; }
        
        @keyframes draw-radar {
            from { stroke-dasharray: 1000; stroke-dashoffset: 1000; fill-opacity: 0; }
            to { stroke-dasharray: 1000; stroke-dashoffset: 0; fill-opacity: 0.2; }
        }
        .animate-draw-radar { animation: draw-radar 2.5s ease-out forwards; }
        
        .fade-in { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f6eceb; }
        ::-webkit-scrollbar-thumb { background: #52898a; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useRef } = React;

        const Icon = ({ name, className }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    const iconKey = Object.keys(window.lucide.icons).find(
                        key => key.toLowerCase() === name.toLowerCase()
                    );
                    if (iconKey) {
                        ref.current.innerHTML = `<i data-lucide="${iconKey}"></i>`;
                        window.lucide.createIcons({ root: ref.current });
                        const svg = ref.current.querySelector('svg');
                        if (svg && className) {
                            svg.classList.add(...className.split(' ').filter(Boolean));
                        }
                    }
                }
            }, [name, className]);
            return <span ref={ref} className="inline-flex items-center justify-center" />;
        };

        const Reveal = ({ children, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            return <div ref={ref} className={`fade-in ${className}`}>{children}</div>;
        };

        const RadarChart = () => {
            const cx = 200; const cy = 200; const r = 140;
            const angles = [-Math.PI / 2, -Math.PI / 6, Math.PI / 6, Math.PI / 2, 5 * Math.PI / 6, -5 * Math.PI / 6];
            const scores = [9.5, 9, 9.5, 9, 8.5, 9];
            const labels = ["Revenue", "Partners", "Advisory", "Leadership", "Strategy", "Execution"];
            const getPath = (values) => values.map((val, i) => `${cx + (val / 10) * r * Math.cos(angles[i])},${cy + (val / 10) * r * Math.sin(angles[i])}`).join(' ');
            return (
                <svg viewBox="0 0 400 400" className="w-full max-w-sm mx-auto">
                    {[2, 4, 6, 8, 10].map(v => <polygon key={v} points={getPath(Array(6).fill(v))} fill="none" stroke="#52898a" strokeWidth="0.5" strokeDasharray="4 4" className="opacity-20" />)}
                    <polygon points={getPath(scores)} fill="#52898a" fillOpacity="0.1" stroke="#52898a" strokeWidth="3" className="animate-draw-radar" />
                    {labels.map((l, i) => <text key={i} x={cx + (r + 40) * Math.cos(angles[i])} y={cy + (r + 40) * Math.sin(angles[i])} textAnchor="middle" className="text-[12px] font-bold fill-[#52898a] uppercase tracking-wider">{l}</text>)}
                </svg>
            );
        };

        const App = () => {
            return (
                <div className="min-h-screen">
                    <nav className="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-gray-100 px-8 py-5 flex justify-between items-center">
                        <div className="font-bold text-[#52898a] tracking-widest text-sm uppercase">Prasheen Dehda <span className="opacity-30 mx-2">|</span> Product Leader</div>
                        <a href="mailto:prasheen.dehda01@gmail.com" className="bg-[#2f3e3e] text-white px-6 py-2 rounded-full text-[10px] font-black tracking-widest hover:bg-black transition-all">CONNECT</a>
                    </nav>

                    <section className="pt-48 pb-32 px-6 text-center max-w-5xl mx-auto">
                        <Reveal>
                            <h1 className="font-cursive text-8xl md:text-9xl text-[#52898a] mb-8 leading-none">Prasheen Dehda</h1>
                            <p className="text-xl md:text-2xl text-gray-400 mb-12 max-w-2xl mx-auto leading-relaxed font-light">
                                Architecting the nexus of <span className="text-[#52898a] font-bold">Cloud Scale</span>, <span className="text-[#52898a] font-bold">AI Strategy</span>, and high-performance **culture**.
                            </p>
                        </Reveal>
                    </section>

                    <section className="py-32 bg-white px-6">
                        <div className="max-w-6xl mx-auto grid md:grid-cols-2 gap-20 items-center">
                            <Reveal>
                                <h2 className="font-cursive text-6xl text-[#52898a] mb-8">Strategic Value</h2>
                                <p className="text-gray-500 text-lg mb-10 leading-relaxed italic">
                                    "Innovation is driven by diversity of thought; scaling is driven by inclusion of systems."
                                </p>
                                <div className="space-y-6">
                                    {[
                                        {t: 'Revenue Engineering', d: 'Consistent $100M+ enterprise pipeline growth.'},
                                        {t: 'Technical Advisory', d: 'Bridging C-suite vision with multi-cloud architecture.'},
                                        {t: 'Strategic Partnerships', d: 'Scaling high-value ecosystem offers with hyperscalers.'}
                                    ].map(item => (
                                        <div key={item.t} className="flex gap-4 items-start">
                                            <div className="mt-1"><Icon name="CheckCircle" className="w-5 h-5 text-[#52898a]" /></div>
                                            <div>
                                                <div className="font-bold text-[#2f3e3e]">{item.t}</div>
                                                <div className="text-sm text-gray-400">{item.d}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </Reveal>
                            <Reveal><RadarChart /></Reveal>
                        </div>
                    </section>

                    <section className="py-32 px-6 max-w-7xl mx-auto">
                        <h2 className="font-cursive text-6xl text-[#52898a] text-center mb-20">Work Experience</h2>
                        <div className="grid md:grid-cols-3 gap-10">
                            {[
                                {role: "Head Product Manager - Google Cloud", company: "Liquid Intelligent Technologies", details: "Architecting a 5-year business plan targeting $100m revenue. Implementing AI solutions for governments based on GCP.", icon: "Cloud"},
                                {role: "Senior Product Manager - Azure", company: "Liquid Intelligent Technologies", details: "Scaled Azure services revenue to $4mn ARR. Orchestrated high-value private co-sell offers.", icon: "Server"},
                                {role: "Product Manager - IoT", company: "Liquid Intelligent Technologies", details: "Generated +$1M revenue by delivering 20+ IoT solutions end-to-end.", icon: "Zap"}
                            ].map((job, i) => (
                                <Reveal key={i} className="bg-white p-10 rounded-[2.5rem] shadow-xl border border-gray-50">
                                    <div className="w-16 h-16 bg-[#f6eceb] rounded-2xl flex items-center justify-center text-[#52898a] mb-8">
                                        <Icon name={job.icon} className="w-8 h-8" />
                                    </div>
                                    <h3 className="font-bold text-xl mb-2 text-[#2f3e3e]">{job.role}</h3>
                                    <p className="text-[#52898a] font-black text-xs tracking-widest mb-6 uppercase">{job.company}</p>
                                    <p className="text-sm text-gray-500 leading-relaxed font-light">{job.details}</p>
                                </Reveal>
                            ))}
                        </div>
                    </section>

                    <section className="py-32 px-6 bg-[#fdfaf9]">
                        <div className="max-w-4xl mx-auto">
                            <h2 className="font-cursive text-6xl text-[#52898a] text-center mb-16">Recommendations</h2>
                            <Reveal className="bg-white p-12 rounded-[3rem] shadow-xl border border-gray-100 relative">
                                <div className="absolute -top-6 left-12 text-6xl text-[#52898a] font-serif">“</div>
                                <div className="flex items-center gap-6 mb-8">
                                    <div className="w-16 h-16 bg-[#52898a] rounded-full flex items-center justify-center text-white font-bold text-xl">DB</div>
                                    <div>
                                        <h4 className="font-bold text-xl text-[#2f3e3e]">David Behr</h4>
                                        <p className="text-sm text-[#52898a] font-medium">Group Chief Enterprise Business Officer, MTN Group</p>
                                        <p className="text-[10px] text-gray-400 uppercase tracking-widest mt-1">April 22, 2026 • Senior to Prasheen at Liquid C2</p>
                                    </div>
                                </div>
                                <p className="text-gray-600 leading-relaxed text-lg font-light italic">
                                    "During my tenure as CEO of Liquid C2, I consistently valued Prasheen's ability to turn strategy into execution. He brought strong process discipline, built practical automation to remove friction, and handled commercial and pricing discussions with clarity and ownership. Prasheen is detail‑oriented without slowing momentum, highly coachable, and genuinely committed to continuous improvement. He has great energy and is a fast learner. He operates comfortably from executive discussions down to delivery details. I’d recommend him without hesitation."
                                </p>
                            </Reveal>
                        </div>
                    </section>

                    <footer className="bg-[#2f3e3e] text-white py-32 px-6 text-center">
                        <Reveal>
                            <h2 className="font-cursive text-7xl mb-12">Let's build the future.</h2>
                            <div className="flex justify-center gap-10 mb-16">
                                <a href="mailto:prasheen.dehda01@gmail.com" className="hover:scale-125 transition-all text-white p-4 border border-white/10 rounded-full"><Icon name="Mail" className="w-8 h-8" /></a>
                                <a href="#" className="hover:scale-125 transition-all text-white p-4 border border-white/10 rounded-full"><Icon name="Linkedin" className="w-8 h-8" /></a>
                            </div>
                            <p className="text-[10px] uppercase tracking-[0.4em] opacity-30">Prasheen Dehda © {new Date().getFullYear()}</p>
                        </Reveal>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
